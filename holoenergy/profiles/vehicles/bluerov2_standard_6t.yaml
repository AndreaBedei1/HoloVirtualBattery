# BlueROV2 Standard (6 x T200: 4 vectored horizontal + 2 vertical), HoloEnergy profile v0.2.
# Thruster count/roles: Blue Robotics product page and ArduSub SUB_FRAME_VECTORED (exact).
# Horizontal thrusters: the same vectored set as the HoloOcean Heavy (the Heavy retrofit only
# adds/moves vertical thrusters). Vertical x,y: Blue Robotics 2017 developer Gazebo model
# (0, +/-0.11 m) -> proxy (C); vertical z does not change a vertical thruster's wrench.
# Dynamics: wrench-equivalent emulation on the HoloOcean BlueROV2 rigid body. Mass/drag
# differences between the physical Standard and Heavy are NOT represented.
