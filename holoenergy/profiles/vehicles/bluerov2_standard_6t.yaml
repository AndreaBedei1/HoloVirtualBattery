# BlueROV2 Standard (6 x T200: 4 vectored horizontal + 2 vertical), HoloEnergy profile v0.2.
# Thruster count/roles: Blue Robotics product page and ArduSub SUB_FRAME_VECTORED (exact).
# Vertical y = +/-0.1105 m from the Blue Robotics 2D drawing (221.0 mm spacing, grade A for y).
# Horizontal thrusters: the same vectored set as the HoloOcean Heavy (the Heavy retrofit only
# adds/moves vertical thrusters). Vertical x,y: Blue Robotics 2017 developer Gazebo model
# (0, +/-0.11 m) -> proxy (C); vertical z does not change a vertical thruster's wrench.
# Dynamics: wrench-equivalent emulation on the HoloOcean BlueROV2 rigid body. Mass/drag
# differences between the physical Standard and Heavy are NOT represented.
schema_version: 1
allow_placeholders: true
profile: package:vehicles/bluerov2_heavy_holoocean.yaml
vehicle:
  name: BlueROV2 Standard (6T, emulated on the HoloOcean BlueROV2 body)
actuators:
  - {id: H1, role: horizontal_vectored, profile: package:actuators/bluerobotics_t200.yaml, position_m: [0.1562, -0.0988, 0.0], direction: [0.7071067811865476, 0.7071067811865476, 0.0]}
  - {id: H2, role: horizontal_vectored, profile: package:actuators/bluerobotics_t200.yaml, position_m: [0.1562, 0.0988, 0.0], direction: [0.7071067811865476, -0.7071067811865476, 0.0]}
  - {id: H3, role: horizontal_vectored, profile: package:actuators/bluerobotics_t200.yaml, position_m: [-0.1562, 0.0988, 0.0], direction: [0.7071067811865476, 0.7071067811865476, 0.0]}
  - {id: H4, role: horizontal_vectored, profile: package:actuators/bluerobotics_t200.yaml, position_m: [-0.1562, -0.0988, 0.0], direction: [0.7071067811865476, -0.7071067811865476, 0.0]}
  - {id: V1, role: vertical, profile: package:actuators/bluerobotics_t200.yaml, position_m: [0.0, -0.1105, 0.0809], direction: [0, 0, 1]}
  - {id: V2, role: vertical, profile: package:actuators/bluerobotics_t200.yaml, position_m: [0.0, 0.1105, 0.0809], direction: [0, 0, 1]}
actuation:
  action_mode: wrench
  allocation: {method: redistributed}
  backend:
    mapping: wrench_equivalent
    agent_type: BlueROV2
    native_clamp_N: 28.75
    native_geometry:
      - {id: V1, position_m: [0.12, -0.2181, 0.0809], direction: [0, 0, 1]}
      - {id: V2, position_m: [0.12, 0.2181, 0.0809], direction: [0, 0, 1]}
      - {id: V3, position_m: [-0.12, 0.2181, 0.0809], direction: [0, 0, 1]}
      - {id: V4, position_m: [-0.12, -0.2181, 0.0809], direction: [0, 0, 1]}
      - {id: H1, position_m: [0.1562, -0.0988, 0.0], direction: [0.7071067811865476, 0.7071067811865476, 0.0]}
      - {id: H2, position_m: [0.1562, 0.0988, 0.0], direction: [0.7071067811865476, -0.7071067811865476, 0.0]}
      - {id: H3, position_m: [-0.1562, 0.0988, 0.0], direction: [0.7071067811865476, 0.7071067811865476, 0.0]}
      - {id: H4, position_m: [-0.1562, -0.0988, 0.0], direction: [0.7071067811865476, -0.7071067811865476, 0.0]}
evidence:
  # Static (bollard) manufacturer curves applied with inflow (current, vehicle motion): the
  # record is exact for the thruster but only representative of its installed operation.
  propulsion: {record: bluerobotics_t200.static_force_power_curve, relation: representative}
  # Review A-03: cell DC-IR (typical, fresh 30Q cell) scaled by 4S/6P, interconnects excluded.
  battery_losses: {record: bluerobotics_4s_18ah.dc_resistance_cell_derived, relation: proxy}
  # y from the Blue Robotics 2D drawing (A); x undimensioned -> the layout stays a proxy.
  geometry: {record: bluerov2_standard.vertical_thruster_lateral_spacing, relation: proxy}
  vehicle_relation: proxy
  # Review I-03: evidence for the physical (dynamics) model, separate from the electrical grades.
  dynamics:
    source: simulator_literal
    records: [holoocean_bluerov2.drag_coefficient, holoocean_bluerov2.drag_area, holoocean_bluerov2.water_density, holoocean_bluerov2.linear_damping, holoocean_bluerov2.mass]
    external_consistency: conflicting
    validation: absent
    notes: EXP9 - published BlueROV2 resistance gives 0.11-0.22x (restrained standard) or 0.87-1.29x (identified Heavy) the HoloOcean propulsion power; the two references disagree by 6-9x.
metadata:
  profile_id: bluerov2-standard
  profile_version: 0.2.0
  status: role-exact layout, proxy vertical positions, manufacturer electrical data
