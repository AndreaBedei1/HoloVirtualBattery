# A REMUS-derived energy profile applied to the generic HoloOcean 2.3.0 TorpedoAUV dynamic class as a
# literature proxy. It is not a REMUS model and not a validated HoloOcean vehicle: geometry, clamp,
# mass and drag are HoloOcean's (simulator-owned, unchanged); only the electrical models are proxies.
schema_version: 1
allow_placeholders: true
simulation:
  dt_s: 0.01
  expected_agent_type: TorpedoAUV
  control_scheme: 0
vehicle:
  name: REMUS-like literature proxy on HoloOcean TorpedoAUV (2.3.0)
  kind: AUV
  dynamics_source: HoloOcean native TorpedoAUV agent (mass 36 kg, Cd 0.05, A 0.5 m2 literals), unchanged
  dynamics_mode: descriptive
battery:
  profile: package:batteries/proxy_remus_1000wh.yaml
environment:
  water_temperature_C: 15.0
  metadata: {note: scenario setting (L0 reference temperature), not vehicle evidence}
actuators:
  - {id: P1, role: propeller, profile: package:actuators/proxy_remus_propulsor.yaml, position_m: [-1.2, 0.0, 0.0], direction: [1, 0, 0], backend_index: 0}
actuation:
  action_mode: thrusters
  backend: {mapping: direct, native_clamp_N: 100, agent_type: TorpedoAUV}
components:
  - name: vehicle_hotel
    device: remus_auv_hotel_load
    category: auxiliaries
    relation: proxy
    includes: [mission_computer, acoustic_navigation_dsp, fin_actuators]
    states:
      BASELINE: {evidence: remus.hotel_load_1997}
      SURVEY_NOMINAL: {evidence: remus100.hotel_power_nominal}
    initial_state: BASELINE
    notes: >-
      BASELINE = itemised 1997 REMUS budget (computer, DSP, motor drivers, fin motors; P029).
      SURVEY_NOMINAL = REMUS 100 power-model hotel with INS, DVL and ADCP (P023): do not add those
      sensors as separate components in that state.
hotel_load: {constant_W: 0}
converters:
  propulsion_efficiency: 1.0
  payload_efficiency: 1.0
  hotel_efficiency: 1.0
  metadata:
    notes: Source powers are battery-side electrical powers; no separate converter losses are added.
evidence:
  propulsion: {record: remus.propulsion_steady_cruise_force_power, relation: proxy}
  geometry: {record: holoocean_torpedoauv.actuator_geometry, relation: exact}
  vehicle_relation: proxy
power_manager: {apply_derating_to_actions: true}
metadata:
  profile_id: torpedo-remus-like
  profile_version: 0.1.0
  status: literature proxy (grade C electrical models), not a validated HoloOcean vehicle
  proxy_statement: >-
    A REMUS-derived energy profile was applied to the generic HoloOcean TorpedoAUV dynamic class
    as a literature proxy.
  relation_to_holoocean_agent: >-
    proxy. HoloOcean TorpedoAUV (1 propeller, 4 fins, 100 N clamp, 36 kg) keeps its
    simulator-exact geometry, mass and drag. The REMUS (19 cm diameter, 31 kg in 1997, P029)
    propulsor and hotel electrical data are attached to its single propeller.
  exact_or_proxy: proxy for every electrical quantity; propeller geometry simulator-exact
  propulsion_electrical_model: >-
    Forward-only steady-cruise force->power table of the 2000 REMUS design (P022): 15 W at
    7.12 N (3 kn) and 110 W at 24.8 N (5.6 kn), thrust taken equal to drag scaled from the
    3.60 lbf design thrust at 4.5 kn (P022 Table 5).
  battery: 1000 Wh Li-ion (P022), L0 ideal bucket; 24 V label from the 1997 REMUS bus (P029); power limit unreported.
  hotel_load: 19.4 W itemised 1997 budget (P029) by default; 60 W REMUS 100 nominal (P023) as state SURVEY_NOMINAL.
  evidence_sources: [P022, P029, P023]
  validity_range: >-
    Forward thrust 7.1-24.8 N, i.e. steady level cruise of the source vehicle at 3-5.6 kn; 0-7.1 N
    is interpolated to the origin; reverse thrust is outside the evidence domain (limited to 0).
  known_gaps:
    - Thrust at the power points is derived (quadratic drag scaling of a design thrust), not measured.
    - The table maps thrust to the power the REMUS drew at its own cruise speed; the simulated
      TorpedoAUV reaches a different speed for the same thrust (simulator-owned drag), and
      advance-speed dependence is not modelled.
    - Implied overall efficiency 0.65-0.73 is high relative to Tethys (0.49) and ALR6000 (0.26-0.38).
    - REMUS 100 field laps (P023 Table I) imply several times more propulsion power at 1.3-1.9 m/s
      than the 2000-design points; hotel and propulsion are from different REMUS generations.
    - Fin actuators are not commanded by this energy model; the native TorpedoAUV command is
      [4 fin angles, thrust] and needs an adapter that inserts the fin angles.
    - Possible overlap between the 1997 motor-driver board budget and the propulsion power is unquantified.
    - Pack voltage of the 2000 Li-ion battery and the battery power limit are not reported.
