# Declares imu/magnetometer: combined with a Navigator or SPRINT-Nav the run reports a shared
# function. That is a double count only if both entries describe the same physical IMU; a
# separate external IMU is a real additional load and both stay on the bus.
name: imu_ahrs
device: vectornav_vn100_rugged
category: sensors
simulation_sensor: IMUSensor
includes: [imu, magnetometer]
states:
  ACTIVE: {evidence: vectornav_vn100_rugged.power}
initial_state: ACTIVE
