model: rint
capacity_Ah: 18.0
nominal_voltage_V: 14.8
initial_soc: 1.0
cutoff_voltage_V: 12.0
max_current_A: 60.0
# PLACEHOLDER: effective DC resistance of the installed pack, not cell AC impedance.
internal_resistance_ohm: 0.04
low_soc_threshold: 0.2
# PLACEHOLDER: illustrative PACK OCV, not a measured Samsung 30Q curve.
ocv_curve:
  - [0.0, 12.0]
  - [0.1, 13.6]
  - [0.2, 14.2]
  - [0.5, 14.8]
  - [0.8, 15.6]
  - [1.0, 16.8]
# Only reference identities. No empirical cold/hot coefficients are invented.
capacity_temperature_curve: [[25.0, 1.0]]
resistance_temperature_curve: [[25.0, 1.0]]
max_current_temperature_curve: [[25.0, 1.0]]
metadata:
  source_id: S5
  value_kind: mixed_datasheet_and_placeholder
  temperature_characterized: false
  datasheet_fields: [capacity_Ah, nominal_voltage_V, cutoff_voltage_V, max_current_A]
  user_settings: [initial_soc, low_soc_threshold]
  placeholders:
    - internal_resistance_ohm
    - ocv_curve
    - capacity_temperature_curve
    - resistance_temperature_curve
    - max_current_temperature_curve
  calibrate:
    - OCV vs reference SOC and pack temperature
    - installed pack DC pulse resistance vs SOC and temperature
    - accessible capacity vs temperature and discharge rate
    - current limits vs temperature and enclosure cooling
    - optional entropy_curve_V_per_K
  notes: Continuous rating only. The 132 A burst rating is not enabled. No built-in BMS assumed.
