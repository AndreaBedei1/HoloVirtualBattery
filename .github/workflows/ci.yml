name: package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked development environment
        run: |
          python -m pip install uv
          uv sync --extra dev --locked --python ${{ matrix.python }}
      - name: Unit tests (no native simulator launch)
        run: uv run --no-sync pytest -q
      - name: Lint
        run: uv run --no-sync ruff check holoenergy examples tools tests
      - name: Format
        run: uv run --no-sync ruff format --check holoenergy examples tools tests
      - name: Reproduce manufacturer import
        run: |
          uv run --no-sync python tools/import_t200.py
          git diff --exit-code -- holoenergy/profiles/thrusters/bluerobotics_t200.json
      - name: Build wheel and source distribution
        run: uv build --out-dir dist
